<!DOCTYPE html>
<html>
<head>
    <title>Greeting</title>
</head>
<body>

<h2 id="msg"></h2>

<script>
let hour = new Date().getHours();
let greeting;

if (hour < 12)
    greeting = "Good Morning";
else if (hour < 17)
    greeting = "Good Afternoon";
else if (hour < 20)
    greeting = "Good Evening";
else
    greeting = "Good Night";

document.getElementById("msg").innerHTML = greeting;
</script>

</body>
</html>
