<!DOCTYPE html>
<html>
<head>
    <title>let, var, const</title>
</head>
<body>

<h2>Difference between var, let and const</h2>

<script>
var a = 10;
var a = 20;      // Allowed

let b = 30;
// let b = 40;   // Not Allowed

const c = 50;
// c = 60;       // Not Allowed

document.write("var = " + a + "<br>");
document.write("let = " + b + "<br>");
document.write("const = " + c);
</script>

</body>
</html>
