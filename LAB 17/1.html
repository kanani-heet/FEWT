<!DOCTYPE html>
<html>
<head>
    <title>ES6 Functions</title>
</head>
<body>

<script>
// let and const
let name = "Heet";
const city = "Rajkot";

// Arrow Function
const greet = () => {
    console.log("Hello " + name);
};

// Template Literal
console.log(`Name: ${name}, City: ${city}`);

greet();
</script>

</body>
</html>
