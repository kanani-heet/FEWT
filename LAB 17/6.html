<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>
</head>
<body>

<script>
let fruits = ["Apple", "Banana", "Mango"];

console.log("Original Array:", fruits);

// Insert
fruits.push("Orange");
console.log("After Insert:", fruits);

// Update
fruits[1] = "Grapes";
console.log("After Update:", fruits);

// Delete
fruits.splice(2, 1);
console.log("After Delete:", fruits);
</script>

</body>
</html>
