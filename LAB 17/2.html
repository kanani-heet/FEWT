<!DOCTYPE html>
<html>
<head>
    <title>Filter Function</title>
</head>
<body>

<script>
let numbers = [10, 15, 20, 25, 30, 35];

let even = numbers.filter(num => num % 2 == 0);

console.log("Original Array:", numbers);
console.log("Even Numbers:", even);
</script>

</body>
</html>
