<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>
<body>

<script>
let num = parseInt(prompt("Enter a number:"));
let original = num;

const palindrome = (n) => {
    let rev = 0;

    while (n > 0) {
        let rem = n % 10;
        rev = rev * 10 + rem;
        n = parseInt(n / 10);
    }

    return rev;
};

if (original == palindrome(num))
    document.write(original + " is a Palindrome");
else
    document.write(original + " is Not a Palindrome");
</script>

</body>
</html>
