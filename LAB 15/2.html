<!DOCTYPE html>
<html>
<head>
    <title>Prime Number</title>
</head>
<body>

<script>
let num = parseInt(prompt("Enter a number:"));

const isPrime = (n) => {
    if (n <= 1)
        return false;

    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i == 0)
            return false;
    }
    return true;
};

if (isPrime(num))
    document.write(num + " is a Prime Number");
else
    document.write(num + " is Not a Prime Number");
</script>

</body>
</html>
