<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>
<body>

<h2 id="text">Hello Student!</h2>

<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
    document.getElementById("text").innerHTML = "Welcome to JavaScript DOM!";
}
</script>

</body>
</html>
