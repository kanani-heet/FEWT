<!DOCTYPE html>
<html>
<head>
    <title>ES6 Features</title>
</head>
<body>

<h2>ES6 Features Demo</h2>

<script>
    // let
    let a = 10;

    // const
    const PI = 3.14;

    // Arrow Function
    const square = num => num * num;

    // Template Literal
    let name = "Heet";

    document.write(`Name: ${name}<br>`);
    document.write(`Square of 5: ${square(5)}<br>`);
    document.write(`PI = ${PI}`);
</script>

</body>
</html>
