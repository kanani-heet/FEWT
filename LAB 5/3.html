<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab 5 5.3</title>
</head>
<body>

	<script>
		
		var a= parseFloat(prompt("enter no.1 :"));
		var b= parseFloat(prompt("enter no.2 :"));
		var c= prompt("enter the your chosice :");

		switch(c)
		{
		case '+':
			alert(a+b);
			break;

		case '-':
			alert(a-b);
			break;

		case '*':
			alert(a*b);
			break;

		case'/' :
			alert(a/b);
			break;

		default:
			alert("invalid");
	

		}
	</script>


</body>
</html>
