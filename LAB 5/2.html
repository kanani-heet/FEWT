<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>lab 5 5.2</title>
</head>
<body>

	<script>
		
		var a= parseFloat(prompt("enter no.1 :"));
		var b= parseFloat(prompt("enter no.2 :"));
		var c= prompt("enter the your chosice :");

		if(c == '+' )
		{
			console.log("add",a+b);
		}
		else if(c == '-' )
		{
			console.log("sub",a-b);
		}
		else if(c == '*' )
		{
			console.log("mul",a*b);
		}
		else if(c == '/' )
		{
			console.log("div",a/b);
		}
		else
		{
			console.log("invalid");
		}

	</script>


</body>
</html>
