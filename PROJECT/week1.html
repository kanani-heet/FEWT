<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <style>
        .complete { color: green; font-weight: bold; }
        .incomplete { color: red; font-style: italic; }
    </style>
</head>
<body>
    <input type="text" id="taskInput" placeholder="Enter task...">
    <button onclick="add('complete')">Complete</button>
    <button onclick="add('incomplete')">Incomplete</button>
    <ul id="list"></ul>

    <script>
        function add(status) {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            
            document.getElementById('list').innerHTML += `<li class="${status}">${input.value}</li>`;
            input.value = '';
        }
    </script>
</body>
</html>
