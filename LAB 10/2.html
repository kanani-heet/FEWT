<!DOCTYPE html>
<html>
<head>
    <title>getElementsByName() Example</title>
</head>
<body>

    <h2>Select Your Favorite Language</h2>

    <input type="radio" name="language" value="Java"> Java <br>
    <input type="radio" name="language" value="Python"> Python <br>
    <input type="radio" name="language" value="JavaScript"> JavaScript <br><br>

    <button onclick="showLanguage()">Submit</button>

    <script>
        function showLanguage() {
            var lang = document.getElementsByName("language");

            for (var i = 0; i < lang.length; i++) {
                if (lang[i].checked) {
                    alert("Selected Language: " + lang[i].value);
                    console.log("Selected Language: " + lang[i].value);
                    document.write("<h3>Your Selected Language is: " + lang[i].value + "</h3>");
                }
            }
        }
    </script>

</body>
</html>
